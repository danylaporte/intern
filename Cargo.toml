[package]
name = "intern"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bench]]
name = "intern_bench"
harness = false

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
parking_lot = "0.13"
roaring = { version = "0.11.5", optional = true }
rustc-hash = "2.1.3"
serde = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
lasso = { version = "0.7", features = ["multi-threaded"] }

[profile.release]
codegen-units = 1
lto = "fat"
